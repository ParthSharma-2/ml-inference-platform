services:
  postgres:
    image: postgres:16
    container_name: ml-serving-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ml_serving}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ml_serving"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s


  redis:
    image: redis:7-alpine
    container_name: ml-serving-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ml-serving-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ml_serving}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      REDIS_URL: redis://redis:6379/0

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ml-serving-worker
    restart: unless-stopped

    # Override the API entrypoint and start Celery instead.
    entrypoint: []

    command:
      - celery
      - -A
      - app.workers.celery_app.celery_app
      - worker
      - --loglevel=info

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ml_serving}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      REDIS_URL: redis://redis:6379/0

    # Worker healthcheck.
    # It checks whether Celery can communicate with the worker.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.workers.celery_app.celery_app inspect ping"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s


volumes:
  postgres_data: